name: Build Breathe2Unlock APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu Android runner image already includes command-line tools.
      # Avoid android-actions/setup-android's obsolete "tools" package request.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore source archive
        shell: bash
        run: |
          cat .build/source.*.b64 | tr -d '\n' | base64 --decode > source.tar.gz
          mkdir -p build-src
          tar -xzf source.tar.gz -C build-src
          test -f build-src/Breathe2Unlock/app/build.gradle.kts

      - name: Run tests and assemble debug APK
        working-directory: build-src/Breathe2Unlock
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Breathe2Unlock-debug-apk
          path: build-src/Breathe2Unlock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
