name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          mkdir -p ${{ env.ANDROID_HOME }}/cmdline-tools
          cd ${{ env.ANDROID_HOME }}/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${{ env.ANDROID_HOME }}/platform-tools" >> $GITHUB_PATH
          ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle and generate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          wrapper-validation-enabled: false

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breathe2Unlock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Breathe2Unlock Debug Build #${{ github.run_number }}"
          body: |
            Debug APK built from commit ${{ github.sha }}

            **Installation:**
            1. Download `Breathe2Unlock-debug-apk` from the assets below
            2. Extract the zip
            3. Install `app-debug.apk` on your Android device
            4. Allow installation from unknown sources if prompted

            **Note:** This is a debug-signed APK for personal testing only.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}