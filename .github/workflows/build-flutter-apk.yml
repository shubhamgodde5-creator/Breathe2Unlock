name: Build Breathe2Unlock Flutter APK

on:
  push:
    branches: [main]
    paths:
      - '.build/flutter-source.part*.b64'
      - '.github/workflows/build-flutter-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_PROJECT: build-app

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Flutter app source
        run: |
          mkdir -p source
          cat .build/flutter-source.part*.b64 | base64 -d > .build/flutter-source.tar.gz
          tar -xzf .build/flutter-source.tar.gz -C source
          test -f source/Breathe2Unlock_Flutter/pubspec.yaml

      - name: Generate Android platform scaffold and install app sources
        run: |
          flutter create --platforms=android --org com --project-name breathe2unlock "$FLUTTER_PROJECT"
          cp source/Breathe2Unlock_Flutter/pubspec.yaml "$FLUTTER_PROJECT/pubspec.yaml"
          cp source/Breathe2Unlock_Flutter/analysis_options.yaml "$FLUTTER_PROJECT/analysis_options.yaml"
          rm -rf "$FLUTTER_PROJECT/lib"
          cp -a source/Breathe2Unlock_Flutter/lib "$FLUTTER_PROJECT/lib"
          mkdir -p "$FLUTTER_PROJECT/test"
          cp -a source/Breathe2Unlock_Flutter/test/. "$FLUTTER_PROJECT/test/"
          cp source/Breathe2Unlock_Flutter/android_custom/AndroidManifest.xml "$FLUTTER_PROJECT/android/app/src/main/AndroidManifest.xml"
          cp -a source/Breathe2Unlock_Flutter/android_custom/app/src/main/. "$FLUTTER_PROJECT/android/app/src/main/"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-app/android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('release {', 'release {\n            signingConfig = signingConfigs.getByName("debug")', 1)
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          p.write_text(s)
          PY

      - name: Resolve Flutter dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: flutter analyze

      - name: Run unit tests
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: flutter test

      - name: Build installable release-mode APK
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: flutter build apk --release

      - name: Verify APK exists
        run: test -s "$FLUTTER_PROJECT/build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Breathe2Unlock-Android-APK
          path: build-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
